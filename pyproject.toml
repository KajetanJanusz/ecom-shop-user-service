[project]
name = "ecom-shop-user-service"
version = "0.1.0"
description = ""
authors = [
    {name = "kajetanjanusz",email = "kajtek.k.janusz@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi ==0.135.1",
    "gunicorn ==25.1.0",
    "sqlalchemy ==2.0.48",
    "pydantic ==2.12.5",
    "pyjwt (>=2.11.0,<3.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "bcrypt (>=3.0.0,<4.0.0)",
    "ecom-shop-shared-lib @ git+https://github.com/KajetanJanusz/ecom-shop-shared-lib.git@dev",
    "factory-boy (>=3.3.3,<4.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[dependency-groups]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
    "ruff ==0.15.5"
]


[tool.pytest.ini_options]
pythonpath = [".", "app", "core"]
filterwarnings = [
    "ignore::DeprecationWarning:passlib",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
